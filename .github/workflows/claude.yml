name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

concurrency:
  group: claude-tag-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude') ||
        github.event.action == 'assigned' ||
        github.event.action == 'labeled'
      ))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TAG_MODEL: ${{ vars.TAG_MODEL || 'claude-opus-5' }}
      TAG_MAX_TURNS: ${{ vars.TAG_MAX_TURNS || '40' }}

    permissions:
      contents: write       
      pull-requests: write   
      issues: write          
      id-token: write
      actions: read          

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        if: >-
          github.event_name != 'issues' &&
          (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.flutter.outcome == 'success'
        run: flutter pub get

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(**/*.g.dart)",
                  "Read(**/*.freezed.dart)",
                  "Read(**/*.gr.dart)",
                  "Read(**/*.gen.dart)",
                  "Read(**/*.config.dart)",
                  "Read(**/generated/**)",
                  "Read(**/app_localizations*.dart)",
                  "Read(**/firebase_options.dart)",
                  "Read(**/generated_plugin_registrant.dart)",
                  "Read(ios/Pods/**)",
                  "Read(**/build/**)",
                  "Read(./.env)",
                  "Read(**/*.jks)",
                  "Read(**/*.keystore)",
                  "Read(**/GoogleService-Info.plist)",
                  "Write(**/*.g.dart)",
                  "Write(**/*.freezed.dart)",
                  "Write(**/*.gr.dart)",
                  "Write(**/*.config.dart)",
                  "Write(**/generated/**)",
                  "Write(ios/Pods/**)",
                  "Write(**/*.pbxproj)",
                  "Bash(git push --force:*)"
                ]
              }
            }

          claude_args: |
            --model ${{ env.TAG_MODEL }}
            --max-turns ${{ env.TAG_MAX_TURNS }}
            --allowedTools "Edit,MultiEdit,Write,Task,Bash(flutter analyze:*),Bash(flutter test:*),Bash(flutter pub:*),Bash(dart format:*),Bash(dart fix:*),Bash(dart run build_runner:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*)"
            --append-system-prompt "Проект - мобильное приложение на Flutter (iOS + Android) с собственным нативным кодом на Kotlin и Swift. Отвечай и комментируй по-русски. Прежде чем отвечать, прочитай обсуждение целиком: тред PR, inline-комментарии ревьюеров и то, что уже было решено - не предлагай повторно то, что команда уже отклонила. Никогда не редактируй генерируемые файлы (.g.dart, .freezed.dart, .gr.dart, .config.dart, локализации, firebase_options.dart) - меняй исходник и запускай build_runner. В треде PR есть служебный комментарий с маркером claude-review-state - не редактируй и не удаляй его, это чекпоинт авто-ревью. Если меняешь MethodChannel или EventChannel - правь обе стороны сразу, Dart и натив, и сверяй имя канала, имена методов, ключи и типы аргументов. Раннер - Linux: flutter analyze, dart format и flutter test доступны, собрать iOS или запустить симулятор нельзя, не пытайся. После правки Dart-кода запусти flutter analyze и dart format на затронутых файлах; нативный код проверить сборкой не получится, поэтому будь осторожнее и описывай риск в комментарии. Не добавляй зависимости в pubspec.yaml без явной просьбы. Если тебя просят провести код-ревью изменений - не делай его в одиночку, запусти субагента bug-hunter и опирайся на его находки, а для полного прогона предложи повесить на PR метку claude-review. Если задача сформулирована неоднозначно - задай уточняющий вопрос в комментарии вместо того, чтобы угадывать. Если правка большая или ты не уверен - опиши план вместо того, чтобы коммитить."