plugins {
    id 'org.springframework.boot' version '3.5.0' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
    id 'org.flywaydb.flyway' version '11.9.1' apply false
}

ext {
    mybatisVersion = '3.5.19'
    mybatisStarterVersion = '3.0.5'
    postgresVersion = '42.7.7'
    mapstructVersion = '1.6.3'
    minioVersion = '8.5.17'
    m3u8ParserVersion = '0.29'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.flywaydb.flyway'

    group = 'org.film.parser'
    version = '1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(24)
        }
    }

    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'

        implementation "org.postgresql:postgresql:${postgresVersion}"
        implementation "org.mybatis:mybatis:${mybatisVersion}"
        implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisStarterVersion}"
        implementation 'org.flywaydb:flyway-core'
        implementation "org.mapstruct:mapstruct:${mapstructVersion}"
        implementation "io.minio:minio:${minioVersion}"
        implementation "io.lindstrom:m3u8-parser:${m3u8ParserVersion}"
        implementation 'com.fasterxml.jackson.core:jackson-databind'

        runtimeOnly 'org.flywaydb:flyway-database-postgresql'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    }

    test {
        useJUnitPlatform()
    }

    // IntelliJ при синхронизации Gradle запрашивает prepareKotlinBuildScriptModel
    // у каждого проекта, а Gradle регистрирует её только в корневом. Без этой
    // заглушки импорт монорепо в IDEA падает с "task not found in project".
    if (!tasks.names.contains('prepareKotlinBuildScriptModel')) {
        tasks.register('prepareKotlinBuildScriptModel')
    }
}
