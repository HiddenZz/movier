name: movier_window
description: >
  Native window control for the movier player. macOS only — reports the
  window's actual fullscreen state, including transitions the system starts
  (green button, Mission Control, Ctrl+Cmd+F, Esc).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MovierWindowPlugin
